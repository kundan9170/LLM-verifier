# ============================================================
#  LLM Reasoning Pipeline — Configuration (Qwen3 + LLM Verifier)
# ============================================================

llm:
  model_name: "Qwen/Qwen3-4B"
  device: "auto"
  load_dtype: "bfloat16"    # CHANGED: Native A100 optimization
  max_cot_tokens: 1024
  return_logprobs: true

  checkpoint:
    min_tokens: 10
    max_tokens: 60

# Qwen3 thinking mode generation settings
generation:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_new_tokens: 200

pipeline:
  enable_early_exit: true
  exit_on_confident_verdict: true
  max_verifier_calls: 30
  min_verifier_calls_before_exit: 3

# ============================================================
#  LLM Verifier (Qwen3-0.6B judge)
# ============================================================
verifier:
  judge_model: "Qwen/Qwen3-0.6B"
  judge_device: "auto"
  judge_dtype: "bfloat16"

  # Max tokens for judge response (short: just "correct"/"wrong" + reason)
  judge_max_tokens: 64

  # Don't return "correct" (done) until this many chunks
  min_checkpoints_before_correct: 3

  # How confident must the judge be to flag an error (0.0 - 1.0)
  # Higher = fewer false positives, might miss some errors
  # Lower = more sensitive, might flag correct steps
  error_confidence_threshold: 0.6

debug:
  print_partial_cot: false
  print_verifier_decision: false
  print_final_answer: false
